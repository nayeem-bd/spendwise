[build]
  command = "npm run build:web"
  publish = "dist"
  # Node version comes from .nvmrc; packages from the public registry via .npmrc.
  # Set EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY in the Netlify UI:
  # Expo inlines them at build time.

# SQLite-WASM needs SharedArrayBuffer, which needs cross-origin isolation.
# require-corp (not credentialless) because Safari only supports require-corp.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Opener-Policy = "same-origin"

# The service worker must never be served stale, or deploys would never reach users.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Single-page app: let deep links like /transactions load index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
